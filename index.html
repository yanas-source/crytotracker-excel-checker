<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пошук Хешів Транзакцій з Excel</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
            max-width: 1100px;
            margin: auto;
        }
        h1, h2 { color: #ffffff; }
        .card {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        input[type="file"] {
            padding: 10px;
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 5px;
            cursor: pointer;
        }
        button {
            padding: 10px 18px;
            background-color: #2e7d32;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            margin-right: 10px;
            margin-top: 10px;
        }
        button:hover { background-color: #388e3c; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .btn-copy { background-color: #f57c00; }
        .btn-copy:hover { background-color: #ef6c00; }
        .btn-download { background-color: #0288d1; }
        .btn-download:hover { background-color: #0277bd; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #444;
            padding: 10px;
            text-align: left;
            word-break: break-all;
        }
        th { background-color: #2a2a2a; color: #fff; }
        tr:nth-child(even) { background-color: #181818; }
        a { color: #4da6ff; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        .status-not-found { color: #f44336; font-weight: bold; }
        .progress { margin-top: 10px; font-size: 1.1em; color: #ffb74d; }
    </style>
</head>
<body>

    <h1>📊 Автоматична Звірка Платежів з Excel</h1>

    <div class="card">
        <p>Завантажте Excel-файл (.xlsx), у якому є колонки: <b>Wallet</b>, <b>Amount</b>, <b>Date</b>, <b>Comment</b>.</p>
        <p><small>Підтримуються мережі: <b>TRON (USDT/TRX)</b> та <b>Ethereum (USDT/USDC/ETH)</b>.</small></p>
        <input type="file" id="excel-file" accept=".xlsx, .xls" />
        <br>
        <button id="process-btn" onclick="processExcel()" disabled>Обробити файл 🚀</button>
        <button id="download-btn" class="btn-download" onclick="downloadExcel()" style="display:none;">Завантажити Excel 📥</button>
        <button id="copy-btn" class="btn-copy" onclick="copyAllLinks()" style="display:none;">Скопіювати всі посилання 📋</button>
        
        <div id="progress" class="progress"></div>
    </div>

    <div class="card" id="result-card" style="display:none;">
        <h2>Результати перевірки:</h2>
        <div style="overflow-x:auto;">
            <table id="result-table">
                <thead>
                    <tr id="table-header"></tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        let parsedData = [];
        let updatedData = [];
        let headers = [];

        document.getElementById('excel-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array', cellDates: false, raw: true });
                const firstSheet = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheet];
                
                parsedData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                
                if (parsedData.length > 0) {
                    headers = Object.keys(parsedData[0]);
                    document.getElementById('process-btn').disabled = false;
                    document.getElementById('progress').innerText = `Файл завантажено. Знайдено рядків: ${parsedData.length}`;
                }
            };
            reader.readAsArrayBuffer(file);
        });

        async function processExcel() {
            document.getElementById('process-btn').disabled = true;
            document.getElementById('download-btn').style.display = 'none';
            document.getElementById('copy-btn').style.display = 'none';
            const progress = document.getElementById('progress');
            
            updatedData = JSON.parse(JSON.stringify(parsedData));

            const addrCol = headers.find(h => /адрес|address|wallet|гаманець/i.test(h)) || headers[0];
            const amountCol = headers.find(h => /сум|amount|sum/i.test(h)) || headers[1];
            const dateCol = headers.find(h => /дат|date/i.test(h)) || headers[2];

            for (let i = 0; i < updatedData.length; i++) {
                const row = updatedData[i];
                const address = String(row[addrCol] || "").trim();
                const targetAmount = parseFloat(row[amountCol]);
                const rawDate = row[dateCol];

                progress.innerText = `Обробка рядка ${i + 1} з ${updatedData.length}...`;

                if (address && !isNaN(targetAmount)) {
                    const txUrl = await findTransaction(address, targetAmount, rawDate);
                    row["Посилання на Блокчейн"] = txUrl || "Не знайдено";
                } else {
                    row["Посилання на Блокчейн"] = "Некоректні дані";
                }

                await new Promise(r => setTimeout(r, 300));
            }

            progress.innerText = "✅ Обробку завершено!";
            document.getElementById('download-btn').style.display = 'inline-block';
            document.getElementById('copy-btn').style.display = 'inline-block';
            displayTable();
        }

        async function findTransaction(address, targetAmount, rawDate) {
            try {
                const targetDate = parseExcelDate(rawDate);

                if (address.startsWith('T')) {
                    const res = await fetch(`https://apilist.tronscan.org/api/token_trc20/transfers?limit=50&relatedAddress=${address}`);
                    const data = await res.json();
                    const txs = data.token_transfers || [];

                    for (let tx of txs) {
                        const decimals = tx.tokenInfo?.tokenDecimal || 6;
                        const txAmount = parseFloat(tx.quant) / Math.pow(10, decimals);
                        const txTimestamp = tx.block_ts;

                        if (isAmountMatch(txAmount, targetAmount) && isDateMatchFlexible(txTimestamp, targetDate)) {
                            return `https://tronscan.org/#/transaction/${tx.transaction_id}`;
                        }
                    }
                } else if (address.startsWith('0x')) {
                    const resToken = await fetch(`https://eth.blockscout.com/api?module=account&action=tokentx&address=${address}`);
                    const dataToken = await resToken.json();

                    if (dataToken.status === "1" && dataToken.result) {
                        for (let tx of dataToken.result) {
                            const decimals = parseInt(tx.tokenDecimal) || 6;
                            const txAmount = parseFloat(tx.value) / Math.pow(10, decimals);
                            const txTimestamp = parseInt(tx.timeStamp) * 1000;

                            if (isAmountMatch(txAmount, targetAmount) && isDateMatchFlexible(txTimestamp, targetDate)) {
                                return `https://etherscan.io/tx/${tx.hash}`;
                            }
                        }
                    }

                    const resEth = await fetch(`https://eth.blockscout.com/api?module=account&action=txlist&address=${address}`);
                    const dataEth = await resEth.json();

                    if (dataEth.status === "1" && dataEth.result) {
                        for (let tx of dataEth.result) {
                            const txAmount = parseFloat(tx.value) / 1e18;
                            const txTimestamp = parseInt(tx.timeStamp) * 1000;

                            if (isAmountMatch(txAmount, targetAmount) && isDateMatchFlexible(txTimestamp, targetDate)) {
                                return `https://etherscan.io/tx/${tx.hash}`;
                            }
                        }
                    }
                }
            } catch (e) {
                console.error("Помилка API:", e);
            }
            return null;
        }

        // Парсер і форматувальник дати (Excel 46226 -> Date Об'єкт)
        function parseExcelDate(val) {
            if (!val) return null;
            if (typeof val === 'number' || !isNaN(Number(val))) {
                const num = Number(val);
                return new Date(Math.round((num - 25569) * 86400 * 1000));
            }
            const parsed = new Date(val);
            return !isNaN(parsed.getTime()) ? parsed : null;
        }

        // Красиве відображення дати у форматі ДД.ММ.РРРР
        function formatDateToReadable(val) {
            const dateObj = parseExcelDate(val);
            if (!dateObj) return val; // Якщо не дата, залишаємо як є
            
            const day = String(dateObj.getDate()).padStart(2, '0');
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const year = dateObj.getFullYear();
            
            return `${day}.${month}.${year}`;
        }

        function isAmountMatch(a, b) {
            return Math.abs(a - b) < 0.05 || Math.abs(a - b) / b < 0.01;
        }

        function isDateMatchFlexible(txTimestamp, targetDate) {
            if (!targetDate) return true;
            const txDate = new Date(txTimestamp);
            const diffInHours = Math.abs(txDate - targetDate) / (1000 * 60 * 60);
            return diffInHours <= 36;
        }

        function displayTable() {
            const tableCard = document.getElementById('result-card');
            const headerRow = document.getElementById('table-header');
            const tbody = document.getElementById('table-body');
            
            tableCard.style.display = 'block';
            headerRow.innerHTML = '';
            tbody.innerHTML = '';

            const allHeaders = Object.keys(updatedData[0]);
            const dateColKey = allHeaders.find(h => /дат|date/i.test(h));
            
            allHeaders.forEach(h => {
                const th = document.createElement('th');
                th.innerText = h;
                headerRow.appendChild(th);
            });

            updatedData.forEach(row => {
                const tr = document.createElement('tr');
                allHeaders.forEach(h => {
                    const td = document.createElement('td');
                    let val = row[h];

                    // Форматування дати тільки для екранної таблиці
                    if (h === dateColKey && val) {
                        val = formatDateToReadable(val);
                    }

                    if (typeof val === 'string' && val.startsWith('http')) {
                        td.innerHTML = `<a href="${val}" target="_blank">Перейти 🔗</a>`;
                    } else if (val === 'Не знайдено') {
                        td.innerHTML = `<span class="status-not-found">❌ Не знайдено</span>`;
                    } else {
                        td.innerText = val;
                    }
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        // Функція для копіювання всіх знайдених посилань
        function copyAllLinks() {
            const links = updatedData
                .map(row => row["Посилання на Блокчейн"])
                .filter(url => typeof url === 'string' && url.startsWith('http'))
                .join('\n');

            if (!links) {
                alert("Немає знайдених посилань для копіювання!");
                return;
            }

            navigator.clipboard.writeText(links).then(() => {
                const copyBtn = document.getElementById('copy-btn');
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "Скопійовано! ✅";
                setTimeout(() => { copyBtn.innerText = originalText; }, 2000);
            }).catch(err => {
                console.error("Помилка копіювання: ", err);
            });
        }

        function downloadExcel() {
            const worksheet = XLSX.utils.json_to_sheet(updatedData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Результати");
            XLSX.writeFile(workbook, "Звірка_З_Посиланнями.xlsx");
        }
    </script>
</body>
</html>
